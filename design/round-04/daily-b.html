<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 4 · Daily B · Halo</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="kit4.css">
<style>
  .gtop { left: 960px; top: 268px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
  .speed { left: 960px; top: 352px; transform: translateX(-50%); font-size: 190px; letter-spacing: -4px; }
  .sunit { left: 960px; top: 548px; transform: translateX(-50%); font: 22px "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .fread { left: 960px; top: 600px; transform: translateX(-50%); display: flex; align-items: baseline; gap: 18px; white-space: nowrap; }
  .fread .ic { width: 32px; height: 32px; background: #c9d1da; -webkit-mask: var(--src) center / contain no-repeat; mask: var(--src) center / contain no-repeat; transform: scaleX(-1); align-self: center; }
  .fread.low .ic { background: var(--caution); }
  .fread.low .rv { color: var(--caution); }
  .fread .sep { width: 1px; height: 30px; background: rgba(255, 255, 255, .14); align-self: center; }
  .temps { left: 96px; top: 280px; width: 400px; }
  .trow { margin-bottom: 54px; }
  .trow .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body class="daily">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="kit4.js"></script>
<script>
// Halo from round 2 daily B: rpm segments over the top, fuel arc closing the bottom, temperatures left, paged card right.
const s = state("daily");
frame(s);
(() => {
  const cx = 960, cy = 500, r = 270, n = 56, max = 7000, red = 6000, lastLit = Math.floor(s.rpm / max * n - .5);
  let g = `<g data-field="tacho rpm">`;
  for (let i = 0; i < n; i++) {
    const t = (i + .5) / n, a = -105 + 210 * t, v = max * t, lit = v <= s.rpm, isRed = v >= red;
    const [x0, y0] = polar(cx, cy, r, a), [x1, y1] = polar(cx, cy, r + (isRed ? 32 : 24), a);
    const op = lit ? .2 + .8 * Math.pow((i + 1) / (lastLit + 1), 1.6) : 1, head = lit && i >= lastLit - 1;
    g += line(x0, y0, x1, y1, lit ? (isRed ? "#ff3b30" : ACC) : isRed ? "#2a1210" : "#12171d", 7, `stroke-linecap="round" stroke-opacity="${op.toFixed(2)}"${head ? ' filter="url(#glow)"' : ""}`);
  }
  // Fuel arc: E at lower left, F at lower right, reserve band tinted. Caution colour at reserve.
  const low = s.fuel <= RESERVE, col = low ? "#ffb020" : ACC, e = 236, f = 124, af = e - (e - f) * s.fuel / 100;
  g += `</g><g data-field="fuelPercentage"><path d="${arc(cx, cy, r + 14, f, e)}" fill="none" stroke="#fff" stroke-opacity=".05" stroke-width="8"/>`;
  g += `<path d="${arc(cx, cy, r + 14, e - (e - f) * RESERVE / 100, e)}" fill="none" stroke="#ffb020" stroke-opacity=".3" stroke-width="8"/>`;
  g += tailArc(cx, cy, r + 14, e, af, 8, col);
  const [ex, ey] = polar(cx, cy, r + 52, e), [fx, fy] = polar(cx, cy, r + 52, f);
  g += text(ex, ey + 8, "E", 22, "#6b7480") + text(fx, fy + 8, "F", 22, "#6b7480") + `</g>`;
  layer(g);
})();
place(`
  <div class="abs gtop">${gear(s, 72)}${chip(s)}</div>
  <div class="abs big speed" data-field="speed">${s.speed}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs fread${s.fuel <= RESERVE ? " low" : ""}" data-field="fuelPercentage DTE"><i class="ic" style="--src:url(${ICON("fuel")})"></i><span class="rv">${s.fuel}<span class="u">%</span></span><span class="sep"></span><span class="rv">${s.range}<span class="u">mi</span></span></div>
  <div class="abs temps">${["coolant", "oil", "trans"].map(k => { const T = s.T[k];
    return `<div class="trow temp ${T.state}" data-field="${T.field}"><div class="head"><span class="k" style="display:flex;align-items:center;gap:14px">${tIcon(T)}${T.label}</span>${tempText(T)}</div>${tempTrack(T)}</div>`; }).join("")}</div>
  ${card(s, "left:1360px;top:280px;width:470px;height:200px")}`);
finish(s);
</script>
</body>
</html>
