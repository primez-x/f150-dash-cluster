<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 8 · Daily B · B Temperature fan</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="../round-06/kit6.css">
<link rel="stylesheet" href="../round-07/kit7.css">
<link rel="stylesheet" href="kit8.css">
<style>
  .gtop { left: 960px; top: 236px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
  .speed { left: 960px; top: 316px; transform: translateX(-50%); font-size: 180px; letter-spacing: -4px; }
  .sunit { left: 960px; top: 496px; transform: translateX(-50%); font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .bend { display: flex; align-items: center; gap: 10px; white-space: nowrap; transform: translateY(-50%); }
  .bend .rv { font-size: 34px; }
</style>
</head>
<body class="daily">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="../round-06/kit6.js"></script>
<script src="../round-07/kit7.js"></script>
<script src="kit8.js"></script>
<script>
// Daily B with the temperatures moved into the bottom-left corner as three concentric bands along the shroud
// (coolant inside, then oil, then transmission). Each value sits at the center end of its band, under the halo.
// Fuel leaves the halo for a module in the bottom-right corner. The card moves under the halo, so the upper sides stay quiet.
const s = state("daily");
frame(s);
halo(s, { fuel: false });
const KEYS = ["coolant", "oil", "trans"], TC = { cold: "#a0ccf5", normal: "#8a929c", warm: "#ffb020", hot: "#ff3b30" };
layer(KEYS.map((k, i) => { const T = s.T[k];
  return band2({ x1: 560, n: 22, len: 30, w: 10, value: T.pct, color: TC[T.state] || QUIET, field: T.field }, i); }).join("") +
  band2({ side: "r", value: (s.fuel ?? 0) / 100, color: fuelColor(s, QUIET), warnTo: lowPct(s) / 100, ends: ["E", "F"], field: "fuelPercentage" }));
// Value labels at the center end of each temperature band.
const ends = KEYS.map((k, i) => { const p = shroudRail(BAND.x0, 560, 22, BAND.d + i * (BAND.len + 12))[21], T = s.T[k];
  return `<div class="abs bend temp ${T.state}" style="left:${(p.x + p.nx * 15 + 40).toFixed(0)}px;top:${(p.y + p.ny * 15 - 12).toFixed(0)}px" data-field="${T.field}">${tIcon(T, 26)}${tempText(T)}</div>`; }).join("");
place(`
  <div class="abs gtop">${gear(s, 72)}${chip(s)}</div>
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  ${ends}
  ${card(s, "left:720px;top:572px;width:480px;height:156px")}
  ${cornerRead({ side: "r", at: "right:48px;top:628px", label: `FUEL${fuelIcon}`, value: dash(s.fuel), unit: "%", sub: `${dash(s.range)}<span class="u">mi to empty</span>`, cls: `xl ${fuelState(s)}`, field: "fuelPercentage DTE" })}`);
finish(s);
</script>
</body>
</html>
