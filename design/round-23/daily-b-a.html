<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 23 · Daily B · A Corner modules</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="../round-06/kit6.css">
<link rel="stylesheet" href="../round-07/kit7.css">
<link rel="stylesheet" href="../round-08/kit8.css">
<link rel="stylesheet" href="../round-09/kit9.css">
<link rel="stylesheet" href="../round-20/kit20.css">
<link rel="stylesheet" href="../round-22/kit22.css">
<link rel="stylesheet" href="kit23.css">
<style>
  .gtop { left: 960px; top: 236px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; }
  .speed { left: 960px; top: 316px; transform: translateX(-50%); font-size: 180px; letter-spacing: -4px; }
  .sunit { left: 960px; top: 496px; transform: translateX(-50%); font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .temps { left: 96px; top: 236px; width: 400px; }
  .trow { margin-bottom: 44px; }
  .trow .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
</style>
</head>
<body class="daily">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="../round-06/kit6.js"></script>
<script src="../round-07/kit7.js"></script>
<script src="../round-08/kit8.js"></script>
<script src="../round-09/kit9.js"></script>
<!-- kit20 draws the heading tape; the daily pages lack the towing panel tables that kit20 extends, so these start empty. -->
<script>var FOCUS = [], SYM = {}, PAGE_SYM = {}, PAGE_STATE = {}, SEC_FOCUS = {}, SEC = {};</script>
<script src="../round-20/kit20.js"></script>
<script src="../round-22/kit22.js"></script>
<script src="kit23.js"></script>
<script>
// Round 23: side stacks (?side=a|b), the compass top center, and cruise beside the speed (kit23.js).
// Round 22: the round 09 page on the measured visible area, with the top bar from ?top=a|b (kit22.js).
// Daily B with one module per bottom corner, the same modules as Daily A option A: instant economy left, fuel right.
// Fuel leaves the halo, so the halo draws RPM only. Temperatures and the card keep the upper sides.
const s = state("daily");
frame(s);
halo(s, { fuel: false });
layer(
  band2({ value: s.mpgNow / 30, field: "instant mpg" }) +
  fuelBand(s)
);
place(`
  <div class="abs gtop">${gear(s, 72)}${chip(s)}</div>
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs temps">${["coolant", "oil", "trans"].map(k => { const T = s.T[k];
    return `<div class="trow temp ${T.state}" data-field="${T.field}"><div class="head"><span class="k" style="display:flex;align-items:center;gap:14px">${tIcon(T)}${T.label}</span>${tempText(T)}</div>${tempTrack(T)}</div>`; }).join("")}</div>
  ${card(s, "left:1360px;top:236px;width:470px;height:200px")}
  ${cornerRead({ at: "left:48px;top:628px", label: "MPG NOW", value: s.mpgNow, cls: "xl", field: "instant mpg" })}
  ${fuelRead(s)}`);
finish(s);
</script>
</body>
</html>
