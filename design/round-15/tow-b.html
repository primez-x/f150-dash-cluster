<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 15 · Towing A · B Grow in place</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="../round-06/kit6.css">
<link rel="stylesheet" href="../round-07/kit7.css">
<link rel="stylesheet" href="../round-08/kit8.css">
<link rel="stylesheet" href="../round-10/kit10.css">
<link rel="stylesheet" href="../round-12/kit12.css">
<link rel="stylesheet" href="../round-13/kit13.css">
<link rel="stylesheet" href="../round-14/kit14.css">
<link rel="stylesheet" href="kit15.css">
<style>
  .speed { right: 1300px; top: 156px; text-align: right; font-size: 210px; letter-spacing: -4px; }
  .sunit { right: 1304px; top: 372px; font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gblk { left: 674px; top: 182px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
  .gblk .row { display: flex; align-items: center; gap: 28px; }
  .state { font: 600 var(--small) "BMW Type Global"; letter-spacing: 4px; color: var(--accent); }
  .tp { column-gap: 40px; }
  .tp .rv { font-size: 30px; }
</style>
</head>
<body class="tow grow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="../round-06/kit6.js"></script>
<script src="../round-07/kit7.js"></script>
<script src="../round-08/kit8.js"></script>
<script src="../round-10/kit10.js"></script>
<script src="../round-12/kit12.js"></script>
<script src="../round-13/kit13.js"></script>
<script src="../round-14/kit14.js"></script>
<script src="kit15.js"></script>
<script>
// Round 15 option B, grow in place: every reading keeps the round 14 position. The reading in focus grows and shows numbers;
// the other secondary readings dim. Calm: nothing grows and nothing dims. The focus rule is focusOf() in kit15.js.
// Fixed on every scene: speed, gear, both corner bands, and the fuel line. The corner readouts grow in place for their focus.
const s = state("tow"), F = focusOf(s);
document.body.classList.add(`focus-${F}`);
frame(s);
layer(
  band({ x1: CORNER_X1, n: 20, value: s.rpm / TACHO_MAX, redFrom: REDLINE / TACHO_MAX, field: "tacho rpm" }) +
  band2({ x1: CORNER_X1, n: 24, len: 14, w: 6, from: boostAt(0), value: boostAt(s.boost), color: boostTint(s), mark: boostAt(0), field: "boost: no firmware field yet (new vehicle signal needed)" }, 1) +
  band({ side: "r", x1: CORNER_X1, n: 20, value: s.braking ? s.output / 10 : 0, avail: s.gain / 10, mark: s.gain / 10, field: "trailer brake output" })
);
const BRAKE_FIELD = "trucksTrailerGain (setting); live output: no firmware field yet (brake pedal + controller output needed)";
const live = F !== "calm", hotT = F === "temps" || F === "warmup", load = F === "climb" || F === "descent";
// Temperature bars: taller with every value in a temperature focus. The transmission value joins a climb or descent focus.
// In any other focus the bars dim; a bar outside normal stays bright.
const bars = `<div class="abs tbars">${["trans", "coolant", "oil", "diff"].map(k => { const T = s.T[k];
  const show = hotT || T.state !== "normal" || (load && k === "trans");
  return `<div class="tb13 temp ${T.state}${live && !show ? " dim" : ""}" data-field="${T.field}">${show ? deg(T) : `<span class="rv slot"></span>`}${tempCol(T, hotT ? 150 : 100)}${tSym(T, 42)}</div>`; }).join("")}</div>`;
const engine = load ? cornerRead({ at: "left:48px;top:628px", label: sym("tach", 44), value: s.rpm.toLocaleString("en-US"),
  sub: `${sym("turbo", 32)}${boostText(s)}<span class="u">psi</span>`, cls: "xl", field: "tacho rpm · boost" }) : engineMarks("left:48px;top:640px");
const brake = F === "brake" || F === "descent"
  ? cornerRead({ side: "r", at: "right:48px;top:628px", label: s.braking ? `<span class="state">BRAKING</span>${sym("trailerBrake", 44)}` : sym("trailerBrake", 44),
    value: (s.braking ? s.output : s.gain).toFixed(1), unit: s.braking ? `of ${s.gain.toFixed(1)}` : "gain", cls: `xl ${s.braking ? "on" : "idle"}`, field: BRAKE_FIELD })
  : `<div class="abs corner r ${s.braking ? "on" : "idle"}" style="right:48px;top:640px" data-field="${BRAKE_FIELD}"><span class="k">${s.braking ? `<span class="state">BRAKING</span>` : ""}${sym("trailerBrake", 44)}</span></div>`;
// Grade joins the gear block beside 2H for a climb or descent focus.
const grade = load ? big(gradeSym(s, 52), gradeText(s.grade), "%", "mPitch (grade = tan pitch)") : "";
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gblk">${gear(s, 120)}<div class="row">${chip(s)}${grade}</div></div>
  ${bars}
  ${F === "tires" ? tires4(s, 180, "left:1200px;top:430px;width:380px").replace('class="abs tp"', 'class="abs tp bigtp"') : ""}
  ${icard(s, "left:200px;top:466px;width:660px;height:108px").replace('class="abs card line"', `class="abs card line${live && !load ? " dim" : ""}"`)}
  ${engine}
  ${brake}
  ${fuelCenter(s, { level: false, quarters: true })}
`);
finish(s);
</script>
</body>
</html>
