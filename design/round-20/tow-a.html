  .sunit { left: 960px; top: 404px; transform: translateX(-50%); font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gblk { left: 1264px; top: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }

<body class="tow grow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>

<script src="kit20.js"></script>
<script>
// Round 20 option A, numbers: the locked Towing A (round 19 A) with steering angle, roll, and compass heading.
// At crawl speed (8 mph and under) or in reverse: the steering bar takes the place of the speed scale, and the level page
// (grade and roll) takes the place of the engine page. A roll past 10 degrees at crawl speed jumps the panel to the level page.
// Level page: the grade and the roll as numbers with symbols, as on every other page.
// Compass: the heading in letters beside the clock, above 5 mph.
const s = state("tow"), F = focusOf(s);
if (params.has("cruise")) s.cruise = params.get("cruise");
applyCrawl(s);
const allT = F === "temps" || F === "warmup";
document.body.classList.add(`focus-${F}`);
frame(s);
crawl(s) ? steerBar(s) : speedRuler(s);
layer(
  band({ x1: CORNER_X1, n: 20, value: s.rpm / TACHO_MAX, redFrom: REDLINE / TACHO_MAX, field: "tacho rpm" }) +
  band2({ x1: CORNER_X1, n: 24, len: 14, w: 6, from: boostAt(0), value: boostAt(s.boost), color: boostTint(s), mark: boostAt(0), field: "boost: no firmware field yet (new vehicle signal needed)" }, 1) +
  band({ side: "r", x1: CORNER_X1, n: 20, value: s.braking ? s.output / 10 : 0, avail: s.gain / 10, mark: s.gain / 10, field: "trailer brake output" })
);
place(`
  ${compass(s)}
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gblk">${gear(s, GEAR_SIZE)}<div class="drow">${driveChip(s)}</div></div>
  ${tBarsK(s, ["trans", "coolant"], allT, "left:270px;top:186px;width:230px")}
  ${tBarsK(s, ["oil", "diff"], allT, "left:1420px;top:186px;width:230px")}
  ${secPanel(s, F, PANEL_C)}
  ${engineMarks("left:48px;top:640px")}
  <div class="abs corner r ${s.braking ? "on" : "idle"}" style="right:48px;top:640px" data-field="${BRAKE_FIELD}"><span class="k">${s.braking ? `<span class="state">BRAKING</span>` : ""}${sym("trailerBrake", 44)}</span></div>
  ${fuelCenter(s, { level: false, quarters: true })}
`);
finish(s);
</script>
</body>
</html>
