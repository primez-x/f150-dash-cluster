<style>
  .speed { right: 1300px; top: 156px; text-align: right; font-size: 210px; letter-spacing: -4px; }
  .sunit { right: 1304px; top: 372px; font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gblk { left: 660px; top: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
  .state { font: 600 var(--small) "BMW Type Global"; letter-spacing: 4px; color: var(--accent); }
  .tp { column-gap: 40px; }
</style>
</head>
<body class="tow grow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="../round-06/kit6.js"></script>
<script src="../round-07/kit7.js"></script>
<script src="../round-08/kit8.js"></script>
<script src="../round-10/kit10.js"></script>
<script src="../round-12/kit12.js"></script>
<script src="../round-13/kit13.js"></script>
<script src="../round-14/kit14.js"></script>
<script src="../round-15/kit15.js"></script>
<script src="kit16.js"></script>
<script>
// Round 16 option B, page dots: Towing A with one paged panel on the right. The page symbol sits at the panel top and dots
// sit under the panel. A page off screen that needs attention shows the page symbol beside the dots in the state colour.
// Pages: trailer, temperatures, tires, engine, trip. A focus (kit15 focusOf) jumps the panel to the page for that reading.
// The gear is a secondary reading: grey and 60 px. Fixed on every scene: speed, gear, both corner bands, and the fuel line.
const NAV = navDots;
const s = state("tow"), F = focusOf(s), P = shownPage(s, F);
document.body.classList.add(`focus-${F}`);
frame(s);
layer(
  band({ x1: CORNER_X1, n: 20, value: s.rpm / TACHO_MAX, redFrom: REDLINE / TACHO_MAX, field: "tacho rpm" }) +
  band2({ x1: CORNER_X1, n: 24, len: 14, w: 6, from: boostAt(0), value: boostAt(s.boost), color: boostTint(s), mark: boostAt(0), field: "boost: no firmware field yet (new vehicle signal needed)" }, 1) +
  band({ side: "r", x1: CORNER_X1, n: 20, value: s.braking ? s.output / 10 : 0, avail: s.gain / 10, mark: s.gain / 10, field: "trailer brake output" })
);
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gblk">${gear(s, GEAR_SIZE)}${chip(s)}</div>
  ${NAV(s, P)}
  ${pageView(s, P)}
  ${engineMarks("left:48px;top:640px")}
  <div class="abs corner r ${s.braking ? "on" : "idle"}" style="right:48px;top:640px" data-field="${BRAKE_FIELD}"><span class="k">${s.braking ? `<span class="state">BRAKING</span>` : ""}${sym("trailerBrake", 44)}</span></div>
  ${fuelCenter(s, { level: false, quarters: true })}
`);
finish(s);
</script>
</body>
</html>
