  .speed { right: 836px; top: 156px; text-align: right; font-size: 210px; letter-spacing: -4px; }
  .sunit { right: 840px; top: 372px; font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gblk { left: 1124px; top: 200px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }

<body class="tow grow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>

<script src="../round-17/kit17.js"></script>
<script src="kit18.js"></script>
<script>
// Round 18 option B, center axis: Towing A balanced on the center line.
// Hero row (y 186 to 396): the speed group on the center line, two temperature bars on each side (transmission and coolant left, oil and differential right).
// Paged panel for the secondary readings on the center line under the hero row (x 610 to 1310). Corners and fuel line below.
// Primary, always on screen: speed, gear, temperatures, both corner bands, and the fuel line. Secondary pages: trailer, tires, engine, trip.
const s = state("tow"), F = focusOf(s);
const allT = F === "temps" || F === "warmup";
document.body.classList.add(`focus-${F}`);
frame(s);
layer(
  band({ x1: CORNER_X1, n: 20, value: s.rpm / TACHO_MAX, redFrom: REDLINE / TACHO_MAX, field: "tacho rpm" }) +
  band2({ x1: CORNER_X1, n: 24, len: 14, w: 6, from: boostAt(0), value: boostAt(s.boost), color: boostTint(s), mark: boostAt(0), field: "boost: no firmware field yet (new vehicle signal needed)" }, 1) +
  band({ side: "r", x1: CORNER_X1, n: 20, value: s.braking ? s.output / 10 : 0, avail: s.gain / 10, mark: s.gain / 10, field: "trailer brake output" })
);
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gblk">${gear(s, GEAR_SIZE)}${chip(s)}</div>
  ${tBarsK(s, ["trans", "coolant"], allT, "left:430px;top:186px;width:230px")}
  ${tBarsK(s, ["oil", "diff"], allT, "left:1260px;top:186px;width:230px")}
  ${secPanel(s, F, PANEL_C)}
  ${engineMarks("left:48px;top:640px")}
  <div class="abs corner r ${s.braking ? "on" : "idle"}" style="right:48px;top:640px" data-field="${BRAKE_FIELD}"><span class="k">${s.braking ? `<span class="state">BRAKING</span>` : ""}${sym("trailerBrake", 44)}</span></div>
  ${fuelCenter(s, { level: false, quarters: true })}
`);
finish(s);
</script>
</body>
</html>
