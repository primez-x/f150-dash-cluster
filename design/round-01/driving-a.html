<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 1 · Driving view A · Twin Dial</title>
<link rel="stylesheet" href="shared.css">
<style>
  #canvas { background: radial-gradient(ellipse 70% 60% at 50% 55%, #141a21 0%, #07090c 70%); }
  .top { top: 26px; font-size: 34px; color: #c9d1da; }
  .top small { font: 18px "BMW Type Global"; color: #7d8792; margin-left: 6px; }
  .dial { position: absolute; top: 0; left: 0; }
  .center-read { position: absolute; text-align: center; transform: translate(-50%, -50%); }
  .speed { font-size: 150px; line-height: 1; }
  .gear { font-size: 170px; line-height: 1; }
  .sub { font: 22px "BMW Type Global"; color: #8b95a1; letter-spacing: 3px; margin-top: 6px; }
  .rpm { font-size: 30px; color: #c9d1da; margin-top: 8px; }
  .truck { left: 960px; top: 232px; height: 330px; transform: translateX(-50%); opacity: .95; }
  .tire { font-size: 30px; color: #c9d1da; text-align: center; width: 110px; }
  .tire small { display: block; font: 14px "BMW Type Global"; color: #6b7480; letter-spacing: 2px; }
  .trip { left: 820px; width: 280px; top: 610px; }
  .trip .row { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 4px; border-top: 1px solid #1f262e; }
  .trip .row:first-child { border-top: 0; }
  .trip .k { font: 18px "BMW Type Global"; letter-spacing: 2px; color: #7d8792; }
  .trip .v { font-size: 32px; }
  .trip .v small { font: 16px "BMW Type Global"; color: #7d8792; margin-left: 6px; }
  .dock { left: 0; right: 0; top: 872px; height: 60px; display: flex; justify-content: center; gap: 0; }
  .dock .chip { display: flex; align-items: baseline; gap: 12px; padding: 0 34px; border-left: 1px solid #1f262e; }
  .dock .chip:first-child { border-left: 0; }
  .dock .k { font: 16px "BMW Type Global"; letter-spacing: 2px; color: #6b7480; }
  .dock .v { font-size: 26px; color: #c9d1da; }
</style>
</head>
<body>
<div id="stage"><div id="canvas">
  <svg id="dials" class="dial" width="1920" height="932"></svg>

  <div class="abs top num" style="left:64px" data-field="native RTC clock">10:42</div>
  <div class="abs top num" style="right:64px" data-field="outSideTemp outSideTempUnit">68<small>°F</small></div>
  <div class="abs telltales" style="left:960px;top:26px;transform:translateX(-50%)" data-field="alarmTable">
    <img src="../../handoff/claude-dashboard/assets/installed/alarm/9.png" alt="">
    <img src="../../handoff/claude-dashboard/assets/installed/alarm/39.png" alt="">
    <img src="../../handoff/claude-dashboard/assets/installed/alarm/24.png" alt="">
  </div>

  <!-- Cruise region A: 300 x 80 at x 810, y 104. Same position on every layout A. -->
  <div class="abs cruise" style="left:810px;top:104px;width:300px;height:80px" data-state="set" data-unit="MPH"></div>

  <div class="center-read" style="left:460px;top:480px" data-field="speed vehicleSpeedUnit">
    <div class="speed num">64</div><div class="sub">MPH</div>
  </div>
  <div class="center-read" style="left:1460px;top:480px" data-field="trucksShiftGear gearString">
    <div class="gear num">D</div><div class="rpm num">2150 <span class="sub">RPM</span></div>
  </div>

  <img class="abs truck" src="../../handoff/claude-dashboard/assets/installed/vehicles/ford/door/black.png" alt="" data-field="door state">
  <div class="abs tire num" style="left:800px;top:270px" data-field="mTpmsPressure FL">35<small>PSI</small></div>
  <div class="abs tire num" style="left:1010px;top:270px" data-field="mTpmsPressure FR">35<small>PSI</small></div>
  <div class="abs tire num" style="left:800px;top:470px" data-field="mTpmsPressure RL">34<small>PSI</small></div>
  <div class="abs tire num" style="left:1010px;top:470px;color:var(--caution)" data-field="mTpmsPressure RR">28<small>PSI</small></div>

  <div class="abs trip">
    <div class="row" data-field="DTE"><span class="k">RANGE</span><span class="v num">312<small>mi</small></span></div>
    <div class="row" data-field="mAvgFuel"><span class="k">AVG</span><span class="v num">17.8<small>mpg</small></span></div>
    <div class="row" data-field="mTripA"><span class="k">TRIP A</span><span class="v num">128.4<small>mi</small></span></div>
  </div>

  <div class="abs dock">
    <div class="chip" data-field="odometer"><span class="k">ODO</span><span class="v num">48213</span></div>
    <div class="chip" data-field="trucksOilLifePercentage"><span class="k">OIL LIFE</span><span class="v num">72%</span></div>
    <div class="chip" data-field="batterVoltage"><span class="k">BATT</span><span class="v num">14.2 V</span></div>
    <div class="chip" data-field="oilTemp"><span class="k">OIL</span><span class="v num">208°F</span></div>
    <div class="chip" data-field="gearBoxTempPercentage"><span class="k">TRANS</span><span class="v num">NORM</span></div>
  </div>
  <div id="physical-label">Physical preview · model index 0 assumption · scale 0.7752</div>
</div></div>
<script src="shared.js"></script>
<script>
// Design values for the mock. Speed sweep 0-120 and tach max are design choices, not recovered geometry.
// Tach max binds to tachoSpeedMax at integration.
const svg = document.getElementById("dials");
const S = (tag, attrs) => `<${tag} ${Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(" ")}/>`;
let out = `<defs>
  <radialGradient id="face" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#151b22"/><stop offset="1" stop-color="#090b0e"/></radialGradient>
  <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a636d"/><stop offset=".5" stop-color="#1d2228"/><stop offset="1" stop-color="#3a424b"/></linearGradient>
  <linearGradient id="prog" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#ffffff" stop-opacity=".55"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>`;

function dial(cx, cy, r, max, major, labelStep, value, redFrom, sub) {
  const a = v => -120 + 240 * v / max;
  out += S("circle", { cx, cy, r: r + 14, fill: "none", stroke: "url(#bezel)", "stroke-width": 6 });
  out += S("circle", { cx, cy, r: r + 8, fill: "url(#face)" });
  out += S("path", { d: arc(cx, cy, r - 30, -120, a(value)), fill: "none", stroke: "url(#prog)", "stroke-width": 22 });
  for (let v = 0; v <= max + 1e-6; v += major / 2) {
    const isMajor = Math.abs(v / major - Math.round(v / major)) < 1e-6;
    const red = redFrom != null && v >= redFrom;
    const [x0, y0] = polar(cx, cy, r - (isMajor ? 26 : 14), a(v)), [x1, y1] = polar(cx, cy, r, a(v));
    out += S("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: red ? "#ff3b30" : isMajor ? "#dfe5ec" : "#5d6670", "stroke-width": isMajor ? 4 : 2 });
    if (isMajor && Math.abs(v / labelStep - Math.round(v / labelStep)) < 1e-6) {
      const [lx, ly] = polar(cx, cy, r - 74, a(v));
      out += `<text x="${lx}" y="${ly + 10}" text-anchor="middle" font-family="Konexy" font-size="28" fill="${red ? "#ff3b30" : "#aab3bd"}">${v}</text>`;
    }
  }
  if (redFrom != null) out += S("path", { d: arc(cx, cy, r + 2, a(redFrom), 120), fill: "none", stroke: "#ff3b30", "stroke-width": 4 });
  const [nx0, ny0] = polar(cx, cy, r - 150, a(value)), [nx1, ny1] = polar(cx, cy, r + 4, a(value));
  out += S("line", { x1: nx0, y1: ny0, x2: nx1, y2: ny1, stroke: "#ff3b30", "stroke-width": 6, "stroke-linecap": "round", filter: "url(#glow)" });
  // Sub-gauge in the lower gap of the main sweep.
  const fillA = 135 + 90 * (1 - sub.pct);
  out += S("path", { d: arc(cx, cy, r - 16, 135, 225), fill: "none", stroke: "#1f262e", "stroke-width": 10, "stroke-linecap": "round" });
  out += S("path", { d: arc(cx, cy, r - 16, fillA, 225), fill: "none", stroke: sub.color, "stroke-width": 10, "stroke-linecap": "round", "data-field": sub.field });
  const [ex, ey] = polar(cx, cy, r - 16, 228), [fx, fy] = polar(cx, cy, r - 16, 132);
  out += `<text x="${ex - 18}" y="${ey + 8}" font-family="BMW Type Global" font-size="20" fill="#7d8792" text-anchor="end">${sub.lo}</text>`;
  out += `<text x="${fx + 18}" y="${fy + 8}" font-family="BMW Type Global" font-size="20" fill="#7d8792">${sub.hi}</text>`;
  out += `<image href="${sub.icon}" x="${cx - 18}" y="${cy + r - 86}" width="36" height="36" opacity=".9"/>`;
}

dial(460, 480, 330, 120, 10, 20, 64, null,
  { pct: .62, color: "#e8ecf1", lo: "E", hi: "F", icon: IMG + "/common/icon/range.png", field: "fuelPercentage" });
dial(1460, 480, 330, 7, 1, 1, 2.15, 6,
  { pct: .48, color: "#e8ecf1", lo: "C", hi: "H", icon: IMG + "/common/icon/water.png", field: "waterTempPercentage" });
svg.innerHTML = out;
</script>
</body>
</html>
