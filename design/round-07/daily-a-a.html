<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 7 · Daily A · A Corner modules</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="../round-06/kit6.css">
<link rel="stylesheet" href="kit7.css">
<style>
  .speed { left: 960px; top: 144px; transform: translateX(-50%); font-size: 240px; letter-spacing: -4px; }
  .sunit { left: 960px; top: 376px; transform: translateX(-50%); font: 22px "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .grow { left: 960px; top: 430px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; }
  .tread { top: 540px; display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body class="daily">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="../round-06/kit6.js"></script>
<script src="kit7.js"></script>
<script>
// Daily A with one module per bottom corner: a thick band along the shroud and one large value in the pocket.
// Fuel on the left (E at the corner, F toward the center), instant economy on the right. The crescents end higher to make room.
const s = state("daily");
frame(s);
layer(
  crescents(s, { a0: 252, t: [252, 296] }) +
  band({ value: (s.fuel ?? 0) / 100, color: fuelColor(s), warnTo: lowPct(s) / 100, ends: ["E", "F"], field: "fuelPercentage" }) +
  band({ side: "r", value: s.mpgNow / 30, mark: s.avg / 30, ends: ["0", "30"], field: "instant mpg mAvgFuel" })
);
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs grow">${gear(s, 84)}${chip(s)}</div>
  <div class="abs tread temp ${s.T.coolant.state}" style="left:400px">${tIcon(s.T.coolant)}${tempText(s.T.coolant)}</div>
  <div class="abs tread temp ${s.T.oil.state}" style="right:400px">${tempText(s.T.oil)}${tIcon(s.T.oil)}</div>
  ${cornerRead({ at: "left:48px;top:628px", label: `${fuelIcon}FUEL`, value: dash(s.fuel), unit: "%", sub: `${dash(s.range)}<span class="u">mi to empty</span>`, cls: `xl ${fuelState(s)}`, field: "fuelPercentage DTE" })}
  ${cornerRead({ side: "r", at: "right:48px;top:628px", label: "MPG NOW", value: s.mpgNow, sub: `avg ${s.avg}<span class="u">mpg</span>`, cls: "xl", field: "instant mpg mAvgFuel" })}
  ${card(s, "left:640px;top:540px;width:640px;height:156px")}`);
finish(s);
</script>
</body>
</html>
