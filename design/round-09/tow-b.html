<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 9 · Towing · B Corner dials</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="../round-06/kit6.css">
<link rel="stylesheet" href="../round-07/kit7.css">
<link rel="stylesheet" href="../round-08/kit8.css">
<link rel="stylesheet" href="kit9.css">
<style>
  .speed { right: 1300px; top: 156px; text-align: right; font-size: 210px; letter-spacing: -4px; }
  .sunit { right: 1304px; top: 372px; font: var(--small) "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gdiv { left: 646px; top: 178px; width: 1px; height: 210px; background: rgba(255, 255, 255, .1); }
  .gblk { left: 674px; top: 182px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .grade { display: flex; align-items: center; gap: 14px; }
  .grade .rv { font-size: 30px; }
  .state { font: 600 var(--small) "BMW Type Global"; letter-spacing: 4px; color: var(--accent); }
  .cols { left: 1010px; top: 190px; width: 800px; display: flex; justify-content: space-between; }
  .tc { width: 170px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tc .rv { font-size: 34px; }
  .tc .lab { height: 34px; display: flex; align-items: center; gap: 10px; }
  .tc .lab .k { font-size: 16px; letter-spacing: 2px; }
  .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; transform: translate(-50%, -50%); white-space: nowrap; }
  .dial .big { font: 64px "BMW Type Global"; line-height: 1; letter-spacing: -1px; color: var(--normal); }
  .dial.on .big { color: var(--accent); }
  .dial .sub { font: 22px "BMW Type Global"; color: #c9d1da; }
</style>
</head>
<body class="tow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="../round-06/kit6.js"></script>
<script src="../round-07/kit7.js"></script>
<script src="../round-08/kit8.js"></script>
<script src="kit9.js"></script>
<script>
// Towing with a dial in each bottom corner, as stock UI1 puts RPM and speed in the corners. The open side of each dial faces
// the shroud. Left, the engine: RPM ring with a boost ring inside (center zero). Right, fuel (E at the corner end of the ring),
// as on every round 9 layout. The trailer brake moves to the upper right, where fuel sat before. The card narrows to clear the engine dial.
const s = state("tow");
frame(s);
const D = { cx: 214, cy: 766, r: 136, a0: 215, a1: 450 };
layer(
  rail({ n: 36, len: 28, w: 9, pts: arcPts(D.cx, D.cy, D.r, D.a0, D.a1, 36), value: s.rpm / TACHO_MAX, redFrom: REDLINE / TACHO_MAX, field: "tacho rpm" }) +
  rail({ n: 30, len: 10, w: 6, pts: arcPts(D.cx, D.cy, D.r - 22, D.a0, D.a1, 30), from: boostAt(0), value: boostAt(s.boost), color: boostTint(s), glow: false, mark: boostAt(0), field: "boost: no firmware field yet (new vehicle signal needed)" }) +
  rail({ side: "r", n: 20, len: 28, w: 11, pts: arcPts(D.cx, D.cy, D.r, D.a0, D.a1, 20), value: (s.fuel ?? 0) / 100, color: fuelColor(s, QUIET), warnTo: lowPct(s) / 100, glow: false, field: "fuelPercentage" })
);
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gdiv"></div>
  <div class="abs gblk">${gear(s, 120)}${chip(s)}</div>
  ${card(s, "left:420px;top:430px;width:440px;height:176px")}
  <div class="abs dial" style="left:${D.cx}px;top:${D.cy - 24}px" data-field="tacho rpm · boost"><span class="k">RPM</span><span class="big">${s.rpm.toLocaleString("en-US")}</span><span class="sub">${boostText(s)}<span class="u">psi boost</span></span></div>
  <div class="abs dial ${fuelState(s)}" style="left:${1920 - D.cx}px;top:${D.cy - 24}px" data-field="fuelPercentage DTE"><span class="k">FUEL</span><span class="big">${dash(s.fuel)}<span class="u">%</span></span><span class="sub">${dash(s.range)}<span class="u">mi to empty</span></span></div>
  <div class="abs cols">${["trans", "coolant", "oil", "diff"].map(k => { const T = s.T[k];
    return `<div class="tc temp ${T.state}" data-field="${T.field}">${tempText(T)}${tempCol(T, 130)}<div class="lab">${T.icon ? `${tIcon(T, 30)}<span class="k">${T.label}</span>` : tIcon(T)}</div></div>`; }).join("")}</div>
  ${tires4(s, 200, "left:990px;top:440px;width:360px")}
  ${brakeBar(s, "left:1390px;top:430px;width:400px")}
  <div class="abs grade" style="left:1000px;top:676px" data-field="mPitch (grade = tan pitch)"><span class="k">GRADE</span>
    <svg width="56" height="26"><path d="M2 24 L54 ${24 - 22 * Math.min(1, s.grade / 10)} L54 24 Z" fill="rgba(138, 146, 156, .18)" stroke="#8a929c" stroke-width="2"/></svg>
    <span class="rv">+${s.grade}<span class="u">%</span></span></div>`);
finish(s);
</script>
</body>
</html>
