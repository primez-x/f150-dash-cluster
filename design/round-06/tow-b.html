<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 6 · Towing · B Shroud rails</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="kit6.css">
<style>
  .speed { right: 1300px; top: 156px; text-align: right; font-size: 210px; letter-spacing: -4px; }
  .sunit { right: 1304px; top: 372px; font: 22px "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gdiv { left: 646px; top: 178px; width: 1px; height: 210px; background: rgba(255, 255, 255, .1); }
  .gblk { left: 674px; top: 182px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .half { left: 960px; top: 180px; width: 1px; height: 530px; background: linear-gradient(transparent, rgba(255, 255, 255, .08), transparent); }

  .grade { display: flex; align-items: center; gap: 14px; }
  .grade .rv { font-size: 30px; }
  .state { font: 600 var(--small) "BMW Type Global"; letter-spacing: 4px; color: var(--accent); }
  .cols { left: 1010px; top: 190px; width: 800px; display: flex; justify-content: space-between; }
  .tc { width: 170px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tc .rv { font-size: 34px; }
  .tc .lab { height: 34px; display: flex; align-items: center; gap: 10px; }
  .tc .lab .k { font-size: 16px; letter-spacing: 2px; }
</style>
</head>
<body class="tow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="kit6.js"></script>
<script>
// Round 5 towing with RPM and the trailer brake drawn as segment rails that follow the shroud edge, readouts above each rail end.
// RPM fills from the bottom-left corner toward the center. Brake output fills from the bottom-right corner; the dim range and
// the white marker show the gain setting. The card moves up under the speed, and the temperature columns get 180 px back.
const s = state("tow");
frame(s);
layer(rail({ n: 36, value: s.rpm / 7000, redFrom: 6 / 7, ends: ["0", "7"], field: "tacho rpm" }) +
  rail({ side: "r", x1: 560, n: 20, value: s.braking ? s.output / 10 : 0, avail: s.gain / 10, mark: s.gain / 10, ends: ["0", "10"], field: "trailer brake output" }));
place(`
  <div class="abs big speed" data-field="speed">${s.speed}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gdiv"></div>
  <div class="abs gblk">${gear(s, 120)}${chip(s)}</div>
  ${card(s, "left:200px;top:450px;width:660px;height:176px")}
  <div class="abs grade" style="left:1390px;top:618px" data-field="mPitch (grade = tan pitch)"><span class="k">GRADE</span>
    <svg width="56" height="26"><path d="M2 24 L54 ${24 - 22 * Math.min(1, s.grade / 10)} L54 24 Z" fill="var(--accent-dim)" stroke="var(--accent)" stroke-width="2"/></svg>
    <span class="rv">+${s.grade}<span class="u">%</span></span></div>
  ${cornerRead({ at: "left:64px;top:672px", label: "RPM", value: s.rpm.toLocaleString("en-US"), unit: "rpm", field: "tacho rpm" })}
  ${cornerRead({ side: "r", at: "right:64px;top:672px", label: s.braking ? `<span class="state">BRAKING</span>` : "TRAILER BRAKE",
    value: (s.braking ? s.output : s.gain).toFixed(1), unit: s.braking ? `of ${s.gain.toFixed(1)}` : "gain", cls: s.braking ? "on" : "", after: "",
    field: "trucksTrailerGain (setting); live output: no firmware field yet (brake pedal + controller output needed)" })}
    <div class="abs half"></div>
  <div class="abs cols">${["trans", "coolant", "oil", "diff"].map(k => { const T = s.T[k];
    return `<div class="tc temp ${T.state}" data-field="${T.field}">${tempText(T)}${tempCol(T, 180)}<div class="lab">${T.icon ? `${tIcon(T, 30)}<span class="k">${T.label}</span>` : tIcon(T)}</div></div>`; }).join("")}</div>
  ${tires4(s, 220, "left:990px;top:490px;width:360px")}
  ${fuel4(s, "left:1390px;top:490px;width:450px")}`);
finish(s);
</script>
</body>
</html>
