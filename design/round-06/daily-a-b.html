<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 6 · Daily A · B Shroud rails</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<link rel="stylesheet" href="kit6.css">
<style>
  .speed { left: 960px; top: 144px; transform: translateX(-50%); font-size: 240px; letter-spacing: -4px; }
  .sunit { left: 960px; top: 376px; transform: translateX(-50%); font: 22px "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .grow { left: 960px; top: 430px; transform: translateX(-50%); display: flex; align-items: center; gap: 18px; }
  .tread { top: 560px; display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body class="daily">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script src="kit6.js"></script>
<script>
// Round 4 Daily A with fuel and instant economy drawn as segment rails that follow the shroud edge.
// Fuel fills from E at the bottom-left corner toward the center; economy mirrors on the right. Readouts sit above each rail end.
// Crescents end a little higher to clear the rails. Clock and outside temperature stay in the top corners.
const s = state("daily");
frame(s);
layer(
  crescents(s, 244) +
  rail({ x1: 560, n: 24, value: (s.fuel ?? 0) / 100, color: fuelColor(s), warnTo: lowPct(s) / 100, ends: ["E", "F"], field: "fuelPercentage" }) +
  rail({ side: "r", x1: 560, n: 24, value: s.mpgNow / 30, ends: ["0", "30"], field: "instant mpg" })
);
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs grow">${gear(s, 84)}${chip(s)}</div>
  <div class="abs tread temp ${s.T.coolant.state}" style="left:430px">${tIcon(s.T.coolant)}${tempText(s.T.coolant)}</div>
  <div class="abs tread temp ${s.T.oil.state}" style="right:430px">${tempText(s.T.oil)}${tIcon(s.T.oil)}</div>
  ${cornerRead({ at: "left:64px;top:690px", label: `${fuelIcon}FUEL`, value: dash(s.fuel), unit: "%", sub: `${dash(s.range)} mi`, cls: fuelState(s), field: "fuelPercentage DTE" })}
  ${cornerRead({ side: "r", at: "right:64px;top:690px", label: "MPG NOW", value: s.mpgNow, sub: `avg ${s.avg}`, field: "instant mpg mAvgFuel" })}
  ${card(s, "left:640px;top:556px;width:640px;height:156px")}`);
finish(s);
</script>
</body>
</html>
