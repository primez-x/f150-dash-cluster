<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 2 · Towing A · Crescent</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="kit.css">
<style>
  .speed { left: 960px; top: 200px; transform: translateX(-50%); font-size: 170px; letter-spacing: -3px; }
  .unit { left: 960px; top: 378px; transform: translateX(-50%); font: 22px "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .rpm { left: 1450px; top: 440px; transform: translateX(-50%); text-align: center; }
  .rpm .big { font-size: 40px; }
  .rig-read { top: 640px; text-align: center; transform: translateX(-50%); }
  .rig-read .mid { font-size: 44px; margin-top: 8px; }
  .gear { left: 960px; top: 742px; transform: translateX(-50%); display: flex; gap: 26px; align-items: center; }
  .gear .big { font-size: 64px; }
</style>
</head>
<body class="tow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="kit.js"></script>
<script>
topBar({ mode: "TOWING", telltales: [121], cruise: "off" });
// Rig: genuine Ford side-view art plus a drawn trailer, tilted by grade. Grade % = tan(pitch).
const pitch = 3.4, grade = Math.tan(pitch * Math.PI / 180) * 100;
const rig = `<g transform="rotate(${pitch} 960 590)" data-field="mPitch mFordPitch">
  <clipPath id="truckband"><rect x="703" y="500" width="264" height="110"/></clipPath>
  <image href="${IMG}/common/gyro/ford/pitch.png" x="640" y="370" width="390" height="390" clip-path="url(#truckband)"/>
  <defs>
    <linearGradient id="trBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a333d"/><stop offset=".5" stop-color="#151b22"/><stop offset="1" stop-color="#0b0f13"/></linearGradient>
    <linearGradient id="trEdge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent);stop-opacity:0"/><stop offset=".5" style="stop-color:var(--accent);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>
  </defs>
  <path d="M1004 571 L1064 556 M1004 571 L1064 586" stroke="#8b95a1" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="1004" cy="571" r="5" fill="#c9d1da"/>
  <rect x="1062" y="470" width="236" height="106" rx="10" fill="url(#trBody)" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <rect x="1074" y="470" width="212" height="2.5" fill="url(#trEdge)"/>
  <line x1="1062" y1="548" x2="1298" y2="548" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
  <rect x="1282" y="500" width="10" height="26" rx="3" fill="#ff3b30" fill-opacity=".3"/>
  <path d="M1132 576 a32 32 0 0 1 104 0" fill="#06080b" stroke="#ffffff" stroke-opacity=".1" stroke-width="1.5"/>
  <circle cx="1160" cy="584" r="17" fill="#0c1014" stroke="#5d6670" stroke-width="5"/><circle cx="1160" cy="584" r="5" fill="#8b95a1"/>
  <circle cx="1208" cy="584" r="17" fill="#0c1014" stroke="#5d6670" stroke-width="5"/><circle cx="1208" cy="584" r="5" fill="#8b95a1"/>
  <line x1="600" y1="601" x2="1340" y2="601" stroke="url(#trEdge)" stroke-opacity=".5" stroke-width="1.5"/>
</g>`;
layer(
  crescent({ cx: 800, cy: 470, r: 560, a0: 232, a1: 305, max: 120, major: 10, labelStep: 20, value: 58, field: "speed" }) +
  crescent({ cx: 1120, cy: 470, r: 560, a0: 128, a1: 55, max: 7, major: 1, labelStep: 1, value: 2.6, redFrom: 6, field: "tacho rpm" }) +
  miniArc({ cx: 800, cy: 470, r: 470, from: 236, to: 262, pct: .58, lo: "C", hi: "H", field: "gearBoxTempPercentage" }) +
  miniArc({ cx: 1120, cy: 470, r: 470, from: 124, to: 98, pct: .52, lo: "C", hi: "H", field: "waterTempPercentage" }) +
  `<image href="${ICON("gearBoxTemp")}" x="420" y="668" width="34" height="34"/>` +
  `<image href="${ICON("water")}" x="1466" y="668" width="34" height="34"/>` + rig
);
place(`
  <div class="abs big speed" data-field="speed">58</div>
  <div class="abs unit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs rpm" data-field="tacho rpm"><div class="mid" style="font-size:40px">2600</div><div class="k">RPM</div></div>
  <div class="abs rig-read" style="left:700px" data-field="mPitch (grade = tan pitch)"><div class="k">GRADE</div><div class="mid">+${grade.toFixed(0)}<span class="u">%</span></div></div>
  <div class="abs rig-read" style="left:960px" data-field="trucksTrailerGain"><div class="k">TRAILER GAIN</div><div class="mid">5.5</div></div>
  <div class="abs rig-read" style="left:1220px" data-field="oilTemp"><div class="k">OIL</div><div class="mid">214<span class="u">°F</span></div></div>
  <div class="abs gear">
    <span class="big" data-field="trucksShiftGear getGearNum()">D<sup style="font-size:30px;color:var(--accent)">4</sup></span>
    ${driveChips("2H", false)}
  </div>
  <div class="abs dock">
    <div class="chip" data-field="gearBoxTempPercentage"><span class="k">TRANS</span><span class="v">NORM</span></div>
    <div class="chip" data-field="mTpmsPressure"><span class="k">TIRES</span><span class="v">OK</span></div>
    <div class="chip" data-field="batterVoltage"><span class="k">BATT</span><span class="v">14.1 V</span></div>
    <div class="chip" data-field="mTripA"><span class="k">TRIP A</span><span class="v">86.2 mi</span></div>
  </div>`);
</script>
</body>
</html>
