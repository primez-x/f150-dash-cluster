<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round 5 · Towing · A and B hybrid</title>
<link rel="stylesheet" href="../round-01/shared.css">
<link rel="stylesheet" href="../round-02/kit.css">
<link rel="stylesheet" href="../round-04/kit4.css">
<style>
  .speed { right: 1300px; top: 156px; text-align: right; font-size: 210px; letter-spacing: -4px; }
  .sunit { right: 1304px; top: 372px; font: 22px "BMW Type Global"; letter-spacing: 8px; color: var(--sub); }
  .gdiv { left: 646px; top: 178px; width: 1px; height: 210px; background: rgba(255, 255, 255, .1); }
  .gblk { left: 674px; top: 182px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .rpmrow { left: 200px; top: 412px; width: 660px; display: flex; align-items: baseline; justify-content: space-between; }
  .half { left: 960px; top: 180px; width: 1px; height: 530px; background: linear-gradient(transparent, rgba(255, 255, 255, .08), transparent); }

  /* Trailer brake: gain is always visible; while the brake pedal is pressed, output segments light up to the live level. */
  .brake .top { display: flex; align-items: baseline; gap: 18px; margin-bottom: 14px; }
  .brake .top .rv { margin-left: auto; }
  .brake .top > * { white-space: nowrap; }
  .brake .state { font: 600 var(--small) "BMW Type Global"; letter-spacing: 4px; color: var(--accent); display: none; }
  .brake.on .state { display: inline; }
  .brake.on .top > .k { display: none; }
  .brake.on .top .rv { color: var(--accent); }
  .brake .segs { position: relative; display: flex; gap: 6px; height: 24px; }
  .brake .segs i { flex: 1; border-radius: 3px; background: rgba(255, 255, 255, .05); }
  .brake .segs i.avail { background: var(--accent-dim); }
  .brake .segs i.lit { background: var(--accent); box-shadow: 0 0 14px var(--accent); }
  .brake .segs i.lit.head { background: #fff; }
  .brake .segs b { position: absolute; top: -7px; bottom: -7px; width: 2px; margin-left: -1px; background: #fff; opacity: .55; }
  .brake .foot { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .brake .foot .rv { font-size: 30px; }

  .cols { left: 1010px; top: 190px; width: 800px; display: flex; justify-content: space-between; }
  .tc { width: 170px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tc .rv { font-size: 34px; }
  .tc .lab { height: 34px; display: flex; align-items: center; gap: 10px; }
  .tc .lab .k { font-size: 16px; letter-spacing: 2px; }
</style>
</head>
<body class="tow">
<div id="stage"><div id="canvas"></div></div>
<script src="../round-01/shared.js"></script>
<script src="../round-02/kit.js"></script>
<script src="../round-04/kit4.js"></script>
<script>
// Left half from towing A: speed, gear, RPM, and the paged card. Right half from towing B: temperature columns
// over tire pressures, fuel, and trailer brake.
const s = state("tow");
frame(s);
layer(segBar({ x0: 200, x1: 860, y: 482, n: 44, max: TACHO_MAX, value: s.rpm, redFrom: REDLINE, h: 20, w: 10 }));
const segs = Array.from({ length: 20 }, (_, i) => {
  const v = (i + 1) / 2, lit = s.braking && v <= s.output;
  return `<i class="${lit ? `lit${v + .5 > s.output ? " head" : ""}` : v <= s.gain ? "avail" : ""}"></i>`;
}).join("");
place(`
  <div class="abs big speed" data-field="speed">${digits(s.speed)}</div>
  <div class="abs sunit" data-field="vehicleSpeedUnit">MPH</div>
  <div class="abs gdiv"></div>
  <div class="abs gblk">${gear(s, 120)}${chip(s)}</div>
  <div class="abs rpmrow" data-field="tacho rpm"><span class="k">RPM</span><span class="rv">${s.rpm.toLocaleString("en-US")}<span class="u">rpm</span></span></div>
  ${card(s, "left:200px;top:554px;width:660px;height:176px")}
  <div class="abs brake${s.braking ? " on" : ""}" style="left:1390px;top:578px;width:450px"
    data-field="trucksTrailerGain (setting); live output: no firmware field yet (brake pedal + controller output needed)">
    <div class="top"><span class="k">TRAILER BRAKE</span><span class="state">BRAKING</span>
      <span class="rv">${s.braking ? s.output.toFixed(1) : s.gain.toFixed(1)}<span class="u">${s.braking ? `of ${s.gain.toFixed(1)}` : "gain"}</span></span></div>
    <div class="segs">${segs}<b style="left:${s.gain * 10}%"></b></div>
    <div class="foot" data-field="mPitch (grade = tan pitch)"><span class="k">GRADE</span>
      <svg width="56" height="26"><path d="M2 24 L54 ${24 - 22 * Math.min(1, s.grade / 10)} L54 24 Z" fill="var(--accent-dim)" stroke="var(--accent)" stroke-width="2"/></svg>
      <span class="rv">+${s.grade}<span class="u">%</span></span></div>
  </div>
    <div class="abs half"></div>
  <div class="abs cols">${["trans", "coolant", "oil", "diff"].map(k => { const T = s.T[k];
    return `<div class="tc temp ${T.state}" data-field="${T.field}">${tempText(T)}${tempCol(T, 130)}<div class="lab">${T.icon ? `${tIcon(T, 30)}<span class="k">${T.label}</span>` : tIcon(T)}</div></div>`; }).join("")}</div>
  ${tires4(s, 230, "left:990px;top:456px;width:360px")}
  ${fuel4(s, "left:1390px;top:456px;width:450px")}`);
finish(s);
</script>
</body>
</html>
